monitor = ,preferred,auto,1


# ------------------------------------------------------------------------------
# Programs
# ------------------------------------------------------------------------------

$terminal    = foot
$fileManager = hyprfm
$browser     = chromium
$mainMod     = SUPER


# ------------------------------------------------------------------------------
# Environment
# ------------------------------------------------------------------------------

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland


# ------------------------------------------------------------------------------
# Autostart
# ------------------------------------------------------------------------------

exec-once = qs
exec-once = /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1 
exec-once = hypridle
exec-once = hyprpaper


# ------------------------------------------------------------------------------
# Input
# ------------------------------------------------------------------------------

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}


# ------------------------------------------------------------------------------
# Layout / appearance
# ------------------------------------------------------------------------------

general {
    gaps_in = 3
    gaps_out = 5
    border_size = 1
}

decoration {
    rounding = 5

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}


# ------------------------------------------------------------------------------
# Workspace behaviour
# ------------------------------------------------------------------------------

binds {
    # Re-pressing the current workspace key jumps back to the previous workspace.
    workspace_back_and_forth = true
}


# ==============================================================================
# KEYBINDS
# ==============================================================================

# ------------------------------------------------------------------------------
# Applications
# ------------------------------------------------------------------------------

bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser


# ------------------------------------------------------------------------------
# Session / windows
# ------------------------------------------------------------------------------

bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, L, exec, hyprlock


# ------------------------------------------------------------------------------
# Focus
# SUPER + arrows
# ------------------------------------------------------------------------------

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d


# ------------------------------------------------------------------------------
# Move windows
# SUPER + SHIFT + arrows
# ------------------------------------------------------------------------------

bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d


# ------------------------------------------------------------------------------
# Mouse window management
# SUPER + LMB = move
# SUPER + RMB = resize
# ------------------------------------------------------------------------------

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ------------------------------------------------------------------------------
# Workspaces
# ------------------------------------------------------------------------------

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# SUPER + mouse wheel = neighbouring workspace
bind = $mainMod, mouse_down, workspace, e+1

bind = $mainMod, mouse_up,   workspace, e-1


# ------------------------------------------------------------------------------
# Scratchpad
#
# SUPER + S          -> show/hide scratchpad
# SUPER + SHIFT + S  -> move current window into scratchpad
#
# The first time the scratch workspace is created, Foot is launched.
# ------------------------------------------------------------------------------

workspace = special:scratch, on-created-empty:$terminal

bind = $mainMod, S, togglespecialworkspace, scratch
bind = $mainMod SHIFT, S, movetoworkspace, special:scratch


# ------------------------------------------------------------------------------
# Window groups
#
# SUPER + G              -> create/dissolve group
# SUPER + TAB            -> next window in group
# SUPER + SHIFT + TAB    -> previous window in group
# ------------------------------------------------------------------------------

bind = $mainMod, G, togglegroup
bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b


# ------------------------------------------------------------------------------
# Brightness
# ------------------------------------------------------------------------------

bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-


# ------------------------------------------------------------------------------
# Volume
# ------------------------------------------------------------------------------

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# ------------------------------------------------------------------------------
# Media
# ------------------------------------------------------------------------------

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous


# ------------------------------------------------------------------------------
# Screenshot
#
# PRINT -> select an area and save it to ~/Pictures/Screenshots/
# ------------------------------------------------------------------------------

bind = , PRINT, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; grim -g "$(slurp)" "$HOME/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"'


# ==============================================================================
# QUICKSHELL IPC
# ==============================================================================

# Launcher
bind = $mainMod, D, exec, qs ipc call launcher toggle

# Notifications
bind = $mainMod, N, exec, qs ipc call notifications dismiss_all
bind = $mainMod SHIFT, N, exec, qs ipc call notifications dnd_toggle

# Monitor controls
bind = $mainMod, O, exec, qs ipc call monitors toggle
bind = $mainMod SHIFT, O, exec, qs ipc call monitors refresh

# Idle control
bind = $mainMod, C, exec, qs ipc call idle toggle


# ==============================================================================
# OPTIONAL WINDOW RULES
#
# First inspect actual app classes:
#
#   hyprctl clients
#
# Then add rules here. Example:
#
# windowrule = float, class:^(mpv)$
#
# I am leaving them disabled so the config does not depend on guessed classes.
# ==============================================================================
