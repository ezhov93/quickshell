schema: spec-driven

context: |
  LPDE — лёгкое окружение для Intel Celeron N3450 и 6 ГБ RAM.
  Hyprland является композитором, Quickshell — runtime собственной оболочки;
  платформенные службы поставляются дистрибутивом. Целевые системы — Arch
  Linux и Debian, но установка полного DE на обеих пока не подтверждена.

  Текущий install.sh разворачивает только QML и qmldir в
  ~/.config/quickshell. Он не устанавливает пакеты, профиль Hyprland или
  службы. Текущая структура и правила находятся в docs/architecture.md,
  продуктовая граница — в docs/project-context.md, свидетельства и пробелы —
  в docs/spec-status.md, проверки — в docs/testing.md.

  Документы и текст OpenSpec пишутся на русском, AGENTS.md — на английском.
  Канонические заголовки Purpose, Requirements, Requirement, Scenario, WHEN,
  THEN сохраняются для валидатора.

rules:
  proposal:
    - Указывай проблему, scope, non-goals и точные изменяемые capability.
    - Не считай roadmap, пример конфигурации или наличие каталога разрешением на реализацию.
    - Отделяй новое поведение от исправления неверного описания существующей системы.
  specs:
    - Описывай наблюдаемый результат, входные условия, ошибки и границы совместимости; не повторяй структуру исходников без внешнего контракта.
    - Для каждого требования определяй основание и обновляй docs/spec-status.md при применении; статус соответствия не помещай в нормативный текст.
    - При MODIFIED сохраняй полный блок требования и все остающиеся сценарии с исходными заголовками.
  design:
    - Перечисляй затронутые файлы и слои, реальные зависимости, побочные эффекты, привилегии, проверку, миграцию и откат.
    - Для polling и фоновых процессов указывай причину, время жизни и ресурсную стоимость; для адаптера указывай собственную ответственность.
    - Не выдавай предложенную структуру или выбранную технологию за уже реализованную.
  tasks:
    - Каждый пункт должен давать конечный результат, называть проверку и быть достаточно малым для отдельного подтверждения выполнения.
    - Располагай задачи по фактическим зависимостям изменения, а не по универсальной последовательности каталогов.
    - Не отмечай частичную, заблокированную или не проверенную по обязательному критерию задачу выполненной.
